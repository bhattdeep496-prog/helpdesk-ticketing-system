<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Deskly{% endblock %} · Deskly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --cream: #f6f5f0;
            --ink: #121a17;
            --panel: #101a16;
            --panel-2: #172420;
            --line: #e3e1d8;
            --sage: #7c8b82;
            --violet: #5b3df5;
            --violet-dark: #4a2fd6;
            --lime: #c7f26b;
            --danger: #e5484d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--cream);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        h4,
        .brand {
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.02em;
        }

        .eyebrow {
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--sage);
        }

        .brand {
            font-weight: 800;
            font-size: 1.35rem;
            display: inline-flex;
            align-items: center;
            gap: .55rem;
            color: inherit;
            text-decoration: none;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--violet);
            display: grid;
            place-items: center;
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
        }

        .btn-violet {
            background: var(--violet);
            color: #fff;
            border: 0;
            font-weight: 600;
            padding: .8rem 1.25rem;
            border-radius: 12px;
            transition: all .2s;
        }

        .btn-violet:hover {
            background: var(--violet-dark);
            color: #fff;
            transform: translateY(-1px);
        }

        .btn-violet:disabled {
            opacity: .7;
            transform: none;
        }

        .fade-up {
            animation: fadeUp .6s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Shared helper: token + API calls (poori UI isi ko use karegi)
        const AUTH_PREFIX = 'Token ';   // agar API ka scheme alag hai to sirf yahan badlega
        const Desk = {
            getToken: () => localStorage.getItem('deskly_token'),
            setToken: (t) => localStorage.setItem('deskly_token', t),
            logout: () => { localStorage.removeItem('deskly_token'); window.location = '/login/'; },
            async api(path, options = {}) {
                const headers = Object.assign({ 'Accept': 'application/json' }, options.headers || {});
                const token = Desk.getToken();
                if (token) headers['Authorization'] = AUTH_PREFIX + token;
        const csrf = (document.cookie.match(/csrftoken=([^;]+)/) || [])[1];
        if (csrf) headers['X-CSRFToken'] = csrf;
                if (options.body && !(options.body instanceof FormData)) {
                    headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(options.body);
                }
                let res;
        try {
          res = await fetch('/api' + path, Object.assign({}, options, { headers }));
        } catch (e) {
          return { ok: false, status: 0, data: { detail: 'Cannot reach the server. Check that runserver is running.' } };
        }
                let data = null;
                try { data = await res.json(); } catch (e) { }
                // 401 = session expire (token tha par galat/purana). Login ka galat password
                // bhi 401 deta hai, wahan redirect nahi karna, sirf error message dikhana hai.
                if (res.status === 401 && token && !path.startsWith('/login/')) { Desk.logout(); }
                return { ok: res.ok, status: res.status, data };
            }
        };
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
