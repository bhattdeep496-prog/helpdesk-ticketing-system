{% extends "ui/auth_base.html" %}
{% block title %}Forgot password{% endblock %}

{% block card %}
<div class="eyebrow">Account recovery</div>
<h2>Forgot password?</h2>
<p class="sub">Enter your email and we will send you a link to choose a new password.</p>

<div id="error-box"></div>
<div id="ok-box" class="alert-ok"></div>

<form id="form" novalidate>
    <div class="mb-4">
        <label for="email">Email</label>
        <input id="email" type="email" class="form-control" autocomplete="email" required>
    </div>
    <button id="submit-btn" class="btn btn-violet w-100" type="submit">Send reset link</button>
    <div class="text-center mt-3"><a href="/login/" class="alt-link">&larr; Back to sign in</a></div>
</form>
{% endblock %}

{% block auth_js %}
<script>
    $('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('email').value.trim();
        if (!email) { showError('Please enter your email.'); return; }
        const btn = $('submit-btn');
        btn.disabled = true; btn.textContent = 'Sending...';
        const res = await Desk.api('/forgot-password/', { method: 'POST', body: { email } });
        btn.disabled = false; btn.textContent = 'Send reset link';
        if (res.ok) {
            let msg = 'If this email is registered, a reset link has been sent. Please check your inbox.';
            // Sirf local (DEBUG) me server ek hint bhejta hai
            if (res.data && res.data.debug) msg += '\n\n[Dev note] ' + res.data.debug;
            showOk(msg);
            $('ok-box').style.whiteSpace = 'pre-line';
        }
        else showError(flatten(res.data));
    });
</script>
{% endblock %}
