{% extends "ui/app_base.html" %}

{% block page_css %}
<style>
    .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 1rem 0 .4rem; display: block; }
    .fx { width: 100%; background: var(--card-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: .6rem .8rem; font-size: .9rem; outline: none; }
    .fx:focus { border-color: var(--accent); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 10px; padding: .5rem 1rem; font-weight: 600; font-size: .88rem; text-decoration: none; cursor: pointer; }
    .btn-ghost:hover { color: var(--text); background: var(--hover); }
    .btn-danger-x { background: transparent; border: 1px solid rgba(229, 72, 77, .4); color: #ff8a8e; border-radius: 10px; padding: .5rem 1rem; font-weight: 600; font-size: .88rem; cursor: pointer; }
    .btn-danger-x:hover { background: rgba(229, 72, 77, .12); }
    .btn-sm-x { padding: .3rem .65rem; font-size: .8rem; border-radius: 8px; }
    .btn-accent:disabled, .btn-ghost:disabled { opacity: .6; }
    .msg { display: none; border-radius: 10px; padding: .7rem .9rem; font-size: .88rem; margin-bottom: 1rem; background: rgba(229, 72, 77, .12); color: #ff8a8e; border: 1px solid rgba(229, 72, 77, .35); }
    .msg.ok { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: .6rem .75rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: .7rem .75rem; border-bottom: 1px solid var(--border); font-size: .9rem; vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl-wrap { overflow-x: auto; }
    .badge-x { display: inline-block; border-radius: 999px; padding: .15rem .6rem; font-size: .74rem; font-weight: 600; background: var(--card-2); border: 1px solid var(--border); color: var(--muted); text-transform: capitalize; }
    .badge-x.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .badge-x.off { background: rgba(229, 72, 77, .12); color: #ff8a8e; border-color: transparent; }
    .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1rem; }
    .toolbar .fx { width: auto; min-width: 150px; }
    .empty-x { text-align: center; color: var(--muted); padding: 2rem 1rem; }

    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 1rem; }
    .overlay.show { display: flex; }
    .modal-x { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; padding: 1.4rem; }
    .modal-x h3 { font-size: 1.15rem; margin: 0 0 .25rem; }

    .toast-x { position: fixed; right: 1.2rem; bottom: 1.2rem; background: var(--card); border: 1px solid var(--accent); color: var(--text); border-radius: 12px; padding: .7rem 1rem; font-size: .88rem; z-index: 3000; display: none; box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
    .toast-x.err { border-color: rgba(229, 72, 77, .6); }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--border); }
    .switch-row:last-of-type { border-bottom: 0; }
    .switch-row small { color: var(--muted); display: block; }
    .form-card { max-width: 760px; }
</style>
{% block manage_css %}{% endblock %}
{% endblock %}

{% block page_js %}
<div class="toast-x" id="toast"></div>
<script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const listOf = (d) => Array.isArray(d) ? d : ((d && d.results) || []);
    function flatten(d) {
        if (!d) return 'Something went wrong.';
        if (typeof d === 'string') return d;
        if (Array.isArray(d)) return d.join(' ');
        if (d.error) return [].concat(d.error).join(' ');
        if (d.detail) return d.detail;
        return Object.entries(d).map(([k, v]) => (k === 'non_field_errors' ? '' : k + ': ') + [].concat(v).join(' ')).join(' | ');
    }
    let toastTimer;
    function toast(text, isErr) {
        const t = $('toast'); t.textContent = text; t.className = 'toast-x' + (isErr ? ' err' : '');
        t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3200);
    }
    function openModal(id) { $(id).classList.add('show'); }
    function closeModal(id) { $(id).classList.remove('show'); }
    document.addEventListener('click', (e) => { if (e.target.classList && e.target.classList.contains('overlay')) e.target.classList.remove('show'); });

    // Admin-only pages: baaki roles ko dashboard par bhej do
    function requireAdmin(start) {
        const go = () => {
            if (Me.role !== 'admin') { window.location = '/dashboard/'; return; }
            start();
        };
        if (Me.role) go(); else window.addEventListener('medata', go, { once: true });
    }
</script>
{% block manage_js %}{% endblock %}
{% endblock %}
