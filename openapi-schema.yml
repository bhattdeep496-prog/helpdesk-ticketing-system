components:
  schemas:
    AdminTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        priority:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        category:
          type: integer
          readOnly: true
          nullable: true
        category_name:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        assigned_to:
          type: string
          readOnly: true
        assigned_to_id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assigned_to
      - assigned_to_id
      - category
      - category_name
      - created_at
      - created_by
      - id
      - priority
      - resolved_at
      - status
      - title
      - updated_at
    AdminTicketDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        category:
          type: integer
          nullable: true
        priority:
          type: string
          maxLength: 50
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_by:
          type: string
          readOnly: true
        assigned_to:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assigned_to
      - created_at
      - created_by
      - description
      - id
      - resolved_at
      - title
      - updated_at
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - id
      - username
    AdminUserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - username
    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        filename:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
        uploaded_by:
          type: string
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - filename
      - id
      - uploaded_at
      - uploaded_by
      - url
    AttachmentUploadRequestRequest:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
      required:
      - files
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
    ChangePasswordRequestRequest:
      type: object
      properties:
        old_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - new_password
      - old_password
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          type: string
          readOnly: true
        author_role:
          type: string
          readOnly: true
        body:
          type: string
        is_internal:
          type: boolean
          description: 'Internal note: only staff can see it.'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - author_role
      - body
      - created_at
      - id
    CommentRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
        is_internal:
          type: boolean
          description: 'Internal note: only staff can see it.'
      required:
      - body
    ForgotPasswordRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    LoginRequestRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    MyTicket:
      type: object
