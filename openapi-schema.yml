openapi: 3.0.3
info:
  title: Helpdesk & Ticketing System API
  version: 1.0.0
  description: |-
    REST API for a helpdesk: customers create tickets, support staff resolve them, admins manage users, categories, priorities, dashboards and reports.

    Login karke token lo (POST /api/login/), phir 'Authorize' button me `Token <your token>` daalo.
paths:
  /api/admin/categories/:
    get:
      operationId: admin_categories_list
      description: |-
        GET  /api/admin/categories/  -> any logged-in user (needed to create tickets)
        POST /api/admin/categories/  -> Admin only
      tags:
      - 'Admin: users & categories'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: admin_categories_create
      description: |-
        GET  /api/admin/categories/  -> any logged-in user (needed to create tickets)
        POST /api/admin/categories/  -> Admin only
      tags:
      - 'Admin: users & categories'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/admin/categories/{id}/:
    get:
      operationId: admin_categories_retrieve
      description: GET for all logged-in users; PATCH/DELETE for Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: users & categories'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: admin_categories_update
      description: GET for all logged-in users; PATCH/DELETE for Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: users & categories'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: admin_categories_partial_update
      description: GET for all logged-in users; PATCH/DELETE for Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: users & categories'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: admin_categories_destroy
      description: GET for all logged-in users; PATCH/DELETE for Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: users & categories'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/tickets/:
    get:
      operationId: admin_tickets_list
      description: |-
        GET /api/admin/tickets/   -> all tickets
        Filters: ?status=new  ?priority=high  ?category=1
                 ?assigned_to=<user id> or ?assigned_to=unassigned
                 ?search=<id or title>
      summary: Saari tickets
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: string
        description: (Sirf Admin) staff user id ya 'unassigned'.
      - in: query
        name: category
        schema:
          type: string
        description: Category id(s) comma se, ya 'none' (bina category).
      - in: query
        name: created_from
        schema:
          type: string
          format: date
        description: YYYY-MM-DD (is din ko mila kar).
      - in: query
        name: priority
        schema:
          type: string
        description: Comma se multiple priority slugs (low, medium, high, critical,
          ...).
      - in: query
        name: search
        schema:
          type: string
        description: 'Ticket ID (12 ya #12), title, description ya comment ka keyword.'
      - in: query
        name: status
        schema:
          type: string
        description: 'Comma se multiple: new, in_progress, resolved, closed.'
      tags:
      - 'Admin: tickets'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminTicket'
          description: ''
  /api/admin/tickets/{id}/:
    get:
      operationId: admin_tickets_retrieve
      description: |-
        GET    /api/admin/tickets/<id>/   -> full ticket details
        PATCH  /api/admin/tickets/<id>/   -> title, description, category, priority, status
        DELETE /api/admin/tickets/<id>/   -> ticket (comments/history ke saath) delete

        Assign karne ke liye /api/admin/tickets/<id>/assign/ use karo.
        Admin status ko kisi bhi value par set kar sakta hai (flow rules support staff
        ke liye hain). Status/priority badalne par history me entry banti hai.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: tickets'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicketDetail'
          description: ''
    patch:
      operationId: admin_tickets_partial_update
      description: |-
        GET    /api/admin/tickets/<id>/   -> full ticket details
        PATCH  /api/admin/tickets/<id>/   -> title, description, category, priority, status
        DELETE /api/admin/tickets/<id>/   -> ticket (comments/history ke saath) delete

        Assign karne ke liye /api/admin/tickets/<id>/assign/ use karo.
        Admin status ko kisi bhi value par set kar sakta hai (flow rules support staff
        ke liye hain). Status/priority badalne par history me entry banti hai.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: tickets'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminTicketDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminTicketDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminTicketDetailRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicketDetail'
          description: ''
    delete:
      operationId: admin_tickets_destroy
      description: |-
        GET    /api/admin/tickets/<id>/   -> full ticket details
        PATCH  /api/admin/tickets/<id>/   -> title, description, category, priority, status
        DELETE /api/admin/tickets/<id>/   -> ticket (comments/history ke saath) delete

        Assign karne ke liye /api/admin/tickets/<id>/assign/ use karo.
        Admin status ko kisi bhi value par set kar sakta hai (flow rules support staff
        ke liye hain). Status/priority badalne par history me entry banti hai.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: tickets'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/admin/tickets/{id}/assign/:
    patch:
      operationId: admin_tickets_assign_partial_update
      description: '`{"assigned_to": <support user id>}` ya `null` (unassign).'
      summary: Ticket manually assign karo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: tickets'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssignRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
          description: ''
  /api/admin/tickets/{id}/auto-assign/:
    post:
      operationId: admin_tickets_auto_assign_create
      description: Sabse kam open tickets wale active support staff ko milta hai.
      summary: Ticket auto-assign karo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: tickets'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
          description: ''
  /api/admin/users/:
    get:
      operationId: admin_users_list
      description: |-
        GET  /api/admin/users/   -> list users (?role=support&is_active=true&search=ali)
        POST /api/admin/users/   -> create a user with a role (Admin only)
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - customer
          - support
      - in: query
        name: search
        schema:
          type: string
        description: Username ya email.
      tags:
      - 'Admin: users & categories'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
          description: ''
    post:
      operationId: admin_users_create
      description: |-
        GET  /api/admin/users/   -> list users (?role=support&is_active=true&search=ali)
        POST /api/admin/users/   -> create a user with a role (Admin only)
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - customer
          - support
      - in: query
        name: search
        schema:
          type: string
        description: Username ya email.
      tags:
      - 'Admin: users & categories'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: |-
        GET   /api/admin/users/<id>/  -> user details
        PATCH /api/admin/users/<id>/  -> change role / deactivate / edit details
        Users are deactivated (is_active=false), never deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: users & categories'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: |-
        GET   /api/admin/users/<id>/  -> user details
        PATCH /api/admin/users/<id>/  -> change role / deactivate / edit details
        Users are deactivated (is_active=false), never deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - 'Admin: users & categories'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/chage-password/:
    post:
      operationId: chage_password_create
      description: |-
        POST {"old_password": "...", "new_password": "..."}
        Header: Authorization: Token <your_token>
        Changes the password of the logged-in user.
      summary: Password badlo (logged-in user)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: GET /api/dashboard/  -> logged-in user ke role ke hisaab se sahi
        dashboard
      tags:
      - Dashboards
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dashboard/admin/:
    get:
      operationId: dashboard_admin_retrieve
      description: GET /api/dashboard/admin/  (Admin only)
      tags:
      - Dashboards
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dashboard/me/:
    get:
      operationId: dashboard_me_retrieve
      description: GET /api/dashboard/me/  (Customer only)
      tags:
      - Dashboards
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/dashboard/support/:
    get:
      operationId: dashboard_support_retrieve
      description: GET /api/dashboard/support/  (Support Staff only)
      tags:
      - Dashboards
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/forgot-password/:
    post:
      operationId: forgot_password_create
      description: |-
        POST {"email": "user@example.com"}
        Sends a password reset uid + token to the user's email.
        (In development, the email is printed in the terminal.)
      summary: Password reset email bhejo
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/login/:
    get:
      operationId: login_retrieve
      description: |-
        API endpoint for user login.
        Accepts 'username' and 'password', authenticates user,
        and returns an auth token.
      summary: Login endpoint info
      tags:
      - Auth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: login_create
      description: 'Username aur password do, response me `token` milta hai. Baaki
        requests me header lagao: `Authorization: Token <token>`.'
      summary: Login (token lo)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/logout/:
    get:
      operationId: logout_retrieve
      description: |-
        API endpoint for user logout.
        Requires Token authentication. Deletes the active auth token and clears the session.
      summary: Logout (token delete)
      tags:
      - Auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: logout_create
      description: |-
        API endpoint for user logout.
        Requires Token authentication. Deletes the active auth token and clears the session.
      summary: Logout (token delete)
      tags:
      - Auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/my-tickets/:
    get:
      operationId: my_tickets_list
      description: 'GET: meri tickets (filters: status, priority, search). POST: nayi
        ticket.'
      tags:
      - Customer tickets
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTicket'
          description: ''
    post:
      operationId: my_tickets_create
      description: 'GET: meri tickets (filters: status, priority, search). POST: nayi
        ticket.'
      tags:
      - Customer tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyTicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyTicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyTicketRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicket'
          description: ''
  /api/my-tickets/{id}/history/:
    get:
      operationId: my_tickets_history_list
      description: |-
        GET /api/my-tickets/<id>/history/
        Status/priority history of one of MY tickets (customer view).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Customer tickets
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketHistory'
          description: ''
  /api/my-tickets/{ticket_id}/:
    get:
      operationId: my_tickets_retrieve
      description: |-
        GET   /api/my-tickets/<id>/   -> ticket details with comments
        PATCH /api/my-tickets/<id>/   -> edit title/description/priority/category
                                         (only while status is 'new')
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: integer
        required: true
      tags:
      - Customer tickets
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicket'
          description: ''
    put:
      operationId: my_tickets_update
      description: |-
        GET   /api/my-tickets/<id>/   -> ticket details with comments
        PATCH /api/my-tickets/<id>/   -> edit title/description/priority/category
                                         (only while status is 'new')
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: integer
        required: true
      tags:
      - Customer tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyTicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyTicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyTicketRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicket'
          description: ''
    patch:
      operationId: my_tickets_partial_update
      description: |-
        GET   /api/my-tickets/<id>/   -> ticket details with comments
        PATCH /api/my-tickets/<id>/   -> edit title/description/priority/category
                                         (only while status is 'new')
      parameters:
      - in: path
        name: ticket_id
        schema:
          type: integer
        required: true
      tags:
      - Customer tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMyTicketRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMyTicketRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMyTicketRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTicket'
          description: ''
  /api/priorities/:
    get:
      operationId: priorities_list
      description: |-
        GET  /api/priorities/   -> sab logged-in users (dropdown ke liye).
                                   Admin ko inactive bhi dikhte hain.
        POST /api/priorities/   -> Admin: {"name": "Blocker", "level": 5}
      tags:
      - Priorities
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Priority'
          description: ''
    post:
      operationId: priorities_create
      description: |-
        GET  /api/priorities/   -> sab logged-in users (dropdown ke liye).
                                   Admin ko inactive bhi dikhte hain.
        POST /api/priorities/   -> Admin: {"name": "Blocker", "level": 5}
      tags:
      - Priorities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PriorityRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PriorityRequest'
        required: true
      security:
